name: Haberleri paylaş (X + Instagram)

on:
  schedule:
    # Yaklaşık 15 dakikada bir (GitHub zamanlaması birkaç dakika gecikebilir)
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      gercek:
        description: "Gerçekten paylaş (kapalıysa yalnızca kuru çalıştırma)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: haber-paylas
  cancel-in-progress: false

jobs:
  paylas:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Haberleri paylaş
        env:
          # Gerçek paylaşım için depo Variables'ında PAYLAS_GERCEK=1 olmalı (elle çalıştırmada kutu da işaretlenebilir)
          PAYLAS_GERCEK: ${{ (vars.PAYLAS_GERCEK == '1' || inputs.gercek) && '1' || '0' }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: python haber_paylas.py docs/paylasilan.json

      - name: Durumu kaydet (yalnızca paylaşılanlar dosyası)
        run: |
          git config user.name  "urfagap-haber-botu"
          git config user.email "actions@users.noreply.github.com"
          git add docs/paylasilan.json
          git diff --cached --quiet && echo "Değişiklik yok" || (git commit -m "Paylaşım durumu: $(date -u +'%F %H:%M UTC')" && git pull --rebase -q && git push)
